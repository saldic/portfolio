{{/* A pixel-art lily in a flower pot that asks for help growing. It blooms
   while it is hovered or focused, and a click writes an email with the
   subject already filled in. */}}
<a class="pixel-lily" href="mailto:dinosaldic.tech@gmail.com?subject=Let%27s%20help%20you%20grow" aria-label="Help me grow: email me">
  <svg viewBox="0 0 21 30" shape-rendering="crispEdges" aria-hidden="true">
    <path class="pixel-lily__tone-1" />
    <path class="pixel-lily__tone-2" />
    <path class="pixel-lily__tone-3" />
    <path class="pixel-lily__tone-4" />
  </svg>
  <span class="pixel-lily__note" aria-hidden="true">Help me grow</span>
</a>
<script>
  // The lily is drawn from text. Each frame is the flower head as rows of
  // pixels, 1 the lightest tone and 3 the darkest, set on the shared stem
  // and pot, where 4 is darker still. Hovering steps it forward to full
  // bloom and leaving steps it back, a frame at a time, so it can turn around
  // halfway.
  (() => {
    const lily = document.currentScript.previousElementSibling;
    const FRAME_MS = 80;
    const POT = `
      ..........4.......33.
      ..........4.....334..
      ..33......4...334....
      ...433....4.334......
      .....334..434........
      .......3444..........
      .......4444444.......
      ....2222222233333....
      ....3233333344444....
      .....44444444444.....
      .....32333334444.....
      .....32333334444.....
      ......323334444......
      ......323334444......
      ......323334444......
      .......3233444.......
      .......3233444.......
    `;
    const HEADS = [`
      .....................
      .....................
      .....................
      .....................
      ..........1..........
      .........122.........
      .........122.........
      .........122.........
      .........122.........
      .........122.........
      .........122.........
      .........122.........
      ..........3..........
    `, `
      .....................
      .....................
      ..........1..........
      .........122.........
      .........122.........
      ........11222........
      ........11222........
      ........11222........
      ........11222........
      ........11222........
      .........122.........
      .........122.........
      ..........3..........
    `, `
      .....................
      ..........1..........
      .......1..1..2.......
      ........1.2.2........
      ........11222........
      ........11222........
      ........11222........
      ........11222........
      ........11222........
      ........11222........
      .........122.........
      .........122.........
      ..........3..........
    `, `
      .....................
      .....1.........2.....
      ......1...1...2......
      ......12.12..32......
      .......12.2.32.......
      .......1122322.......
      .......1122322.......
      ........11222........
      ........11222........
      ........11222........
      .........122.........
      .........122.........
      ..........3..........
    `, `
      .....................
      .....................
      ..11.............22..
      .1..12..3.1.3..32..2.
      ....112.31223.322....
      ......112223322......
      ......112223322......
      .......1122322.......
      ........11222........
      ........11222........
      .........122.........
      .........122.........
      ..........3..........
    `, `
      .......11.1.22.......
      ........3.3.3........
      ..11.....333.....22..
      .1..12..3.1.3..32..2.
      1...112.31223.322...2
      ......112223322......
      ......112223322......
      .......1122322.......
      ........11222........
      ........11222........
      .........122.........
      .........122.........
      ..........3..........
    `];

    const paths = [...lily.querySelectorAll("path")];
    const runs = (rows, tone) => rows.flatMap((row, y) =>
      [...row.matchAll(new RegExp(`${tone}+`, "g"))].map((run) => `M${run.index} ${y}h${run[0].length}v1h-${run[0].length}z`));
    const frames = HEADS.map((head) => {
      const rows = `${head.trim()}\n${POT.trim()}`.split("\n").map((row) => row.trim());
      return paths.map((path, i) => runs(rows, i + 1).join(""));
    });
    const draw = (index) => frames[index].forEach((d, i) => paths[i].setAttribute("d", d));

    // The note decodes in each time it appears, like the rest of the text.
    const note = lily.querySelector(".pixel-lily__note");
    const chars = [...minimalCaps(note.textContent.trim())];
    const letters = minimalFlap ? minimalFlap.build(note).map((cell, i) => ({ cell, char: chars[i] })) : [];
    const speak = (open) => {
      if (lily.classList.contains("is-open") === open) return;
      lily.classList.toggle("is-open", open);
      if (!open || !letters.length) return;
      minimalFlap.fitCells(letters, note);
      letters.forEach(({ cell, char }, i) => {
        minimalFlap.settle(cell, " ", 0);
        window.setTimeout(() => minimalFlap.settle(cell, char, 5), 120 + i * 30);
      });
    };

    const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let shown = 0;
    let target = 0;
    let timer = 0;
    const step = () => {
      shown = still ? target : shown + Math.sign(target - shown);
      draw(shown);
      timer = shown === target ? 0 : window.setTimeout(step, FRAME_MS);
    };
    const bloom = (open) => {
      target = open ? frames.length - 1 : 0;
      speak(open);
      if (!timer && shown !== target) step();
    };
    draw(0);

    lily.addEventListener("pointerenter", (event) => event.pointerType === "mouse" && bloom(true));
    lily.addEventListener("pointerleave", (event) => event.pointerType === "mouse" && bloom(false));
    lily.addEventListener("focus", () => lily.matches(":focus-visible") && bloom(true));
    lily.addEventListener("blur", () => !lily.matches(":hover") && bloom(false));

    // On a touch screen the first tap shows the bloom and the note, and a
    // second tap, while it is open, writes the email.
    let pointer = "mouse";
    let closeLater;
    lily.addEventListener("pointerdown", (event) => {
      pointer = event.pointerType;
    });
    lily.addEventListener("click", (event) => {
      if (pointer === "mouse" || lily.classList.contains("is-open")) return;
      event.preventDefault();
      bloom(true);
      window.clearTimeout(closeLater);
      closeLater = window.setTimeout(() => bloom(false), 4000);
    });
  })();
</script>
