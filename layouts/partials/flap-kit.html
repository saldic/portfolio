<script>
  // Names that are always written in lowercase, even where the rest of the
  // text is set in capitals.
  const minimalNames = ["eru"];
  const minimalNamePattern = () => new RegExp(`\\b(?:${minimalNames.join("|")})(?:['’]s)?\\b`, "gi");
  const minimalCaps = (text) => text.toUpperCase().replace(minimalNamePattern(), (name) => name.toLowerCase());

  // Where CSS sets the capitals instead, wraps the names so they keep their case.
  const minimalKeepCase = (element) => {
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) if (minimalNamePattern().test(walker.currentNode.textContent)) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      const parts = node.textContent.split(new RegExp(`(${minimalNamePattern().source})`, "i"));
      node.replaceWith(...parts.map((part, i) => {
        if (i % 2 === 0) return part;
        const name = document.createElement("span");
        name.className = "minimal-keep-case";
        name.textContent = part.toLowerCase();
        return name;
      }));
    });
  };

  // Letter-board kit for the minimal pages: every letter sits in a cell of
  // its own and decodes into place, running through a few random letters
  // before it lands. It is null with reduced motion, and the text then simply
  // stays as plain text.
  const minimalFlap = (() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;

    const STEP_MS = 55; // how long each passing letter shows
    const TRACKING = 0.08; // em of space around each settled letter
    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const LOWER = UPPER.toLowerCase();
    const ruler = document.createElement("canvas").getContext("2d");
    const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

    // Measures single letters in `element`'s font; widths come back in em.
    const measure = (element) => {
      const style = getComputedStyle(element);
      const size = parseFloat(style.fontSize);
      ruler.font = `${style.fontWeight} ${size}px ${style.fontFamily}`;
      const widths = new Map();
      return (char) => {
        if (!widths.has(char)) widths.set(char, ruler.measureText(char).width / size);
        return widths.get(char);
      };
    };

    // Sizes every cell to the letter it will settle on, so the finished text
    // is spaced like type rather than like a grid. A cell then only passes
    // through letters that fit in it, so nothing spills over its neighbours.
    const fitCells = (letters, element) => {
      const width = measure(element);
      letters.forEach(({ cell, char }) => {
        cell.width = width(char) + TRACKING;
        cell.fits = (other) => width(other) <= cell.width - TRACKING / 2;
        cell.element.style.width = `${cell.width.toFixed(3)}em`;
      });
    };

    const show = (cell, char) => {
      cell.face.textContent = char;
      cell.current = char;
    };

    // Shows `next` and holds it for one step.
    const swap = async (cell, next) => {
      cell.busy = true;
      show(cell, next);
      await wait(STEP_MS);
      cell.busy = false;
    };

    // A random letter that fits the cell, in the case of `like`. The
    // narrowest cells, with room for little more than an I, may go blank.
    const random = (cell, like = "A") => {
      const letters = [...(like !== like.toUpperCase() ? LOWER : UPPER)];
      const fitting = cell.fits ? letters.filter(cell.fits) : letters;
      const pool = fitting.length >= 3 ? fitting : [...fitting, " "];
      return pool[Math.floor(Math.random() * pool.length)];
    };

    // Swaps the content of `line` for `length` blank cells and keeps the
    // real text in a hidden label for screen readers.
    const build = (line, length = line.textContent.trim().length) => {
      const label = document.createElement("span");
      label.className = "minimal-flap__label";
      label.append(...line.childNodes);
      const row = document.createElement("span");
      row.className = "minimal-flap__row";
      row.setAttribute("aria-hidden", "true");

      const cells = Array.from({ length }, () => {
        const element = document.createElement("span");
        element.className = "minimal-flap__cell";
        const face = document.createElement("span");
        face.className = "minimal-flap__face";
        element.append(face);
        row.append(element);
        const cell = { element, face, busy: false, job: 0 };
        show(cell, " ");
        return cell;
      });
      line.replaceChildren(label, row);
      return cells;
    };

    // Decodes a cell into `target`: it runs through `steps` random letters
    // that fit it, then lands. A newer call takes over from an older one.
    const settle = async (cell, target, steps = 6) => {
      const job = ++cell.job;
      while (cell.busy) await wait(20);
      const like = target === " " ? cell.current : target;
      for (let i = 0; i < steps; i++) {
        if (cell.job !== job) return;
        await swap(cell, random(cell, like));
      }
      if (cell.job === job) await swap(cell, target);
    };

    // Rebuilds `element` as rows of blank cells for `words`, wrapped to
    // `maxWidth` pixels, and returns every cell with the letter it is to show.
    const compose = (element, words, maxWidth) => {
      const width = measure(element);
      const size = parseFloat(getComputedStyle(element).fontSize);
      const span = (text) => [...minimalCaps(text)].reduce((sum, char) => sum + width(char) + TRACKING, 0) * size;
      const rows = words
        .reduce((fitted, word) => {
          const last = fitted[fitted.length - 1];
          if (last && span(`${last} ${word}`) <= maxWidth) fitted[fitted.length - 1] = `${last} ${word}`;
          else fitted.push(word);
          return fitted;
        }, [])
        .map((text) => {
          const row = document.createElement("span");
          row.className = "minimal-flap__line";
          row.textContent = text;
          return row;
        });
      element.replaceChildren(...rows);
      const letters = rows.flatMap((row) => {
        const chars = [...minimalCaps(row.textContent)];
        return build(row).map((cell, i) => ({ cell, char: chars[i] }));
      });
      fitCells(letters, element);
      return letters;
    };

    return { build, show, swap, random, settle, measure, fitCells, compose };
  })();
</script>
