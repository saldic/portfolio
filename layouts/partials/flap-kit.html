<script>
  // Names that are always written in lowercase, even where the rest of the
  // text is set in capitals.
  const minimalNames = ["eru"];
  const minimalCaps = (text) => minimalNames.reduce((out, name) => out.replace(new RegExp(`\\b${name}\\b`, "gi"), name), text.toUpperCase());

  // Where CSS sets the capitals instead, wraps the names so they keep their case.
  const minimalKeepCase = (element) => {
    const pattern = new RegExp(`\\b(${minimalNames.join("|")})\\b`, "i");
    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) if (pattern.test(walker.currentNode.textContent)) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      const parts = node.textContent.split(new RegExp(`\\b(${minimalNames.join("|")})\\b`, "i"));
      node.replaceWith(...parts.map((part, i) => {
        if (i % 2 === 0) return part;
        const name = document.createElement("span");
        name.className = "minimal-keep-case";
        name.textContent = part.toLowerCase();
        return name;
      }));
    });
  };

  // Split-flap kit for the minimal pages. It is null without the Web
  // Animations API or with reduced motion, and the text then simply stays as
  // plain text.
  const minimalFlap = (() => {
    if (!Element.prototype.animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;

    const FLIP_MS = 64; // one flap
    const TRACKING = 0.08; // em of space around each settled letter
    const DRUM = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789·-↗?abcdefghijklmnopqrstuvwxyz";
    const ruler = document.createElement("canvas").getContext("2d");

    // Measures single letters in `element`'s font; widths come back in em.
    const measure = (element) => {
      const style = getComputedStyle(element);
      const size = parseFloat(style.fontSize);
      ruler.font = `${style.fontWeight} ${size}px ${style.fontFamily}`;
      const widths = new Map();
      return (char) => {
        if (!widths.has(char)) widths.set(char, ruler.measureText(char).width / size);
        return widths.get(char);
      };
    };

    // Sizes every cell to the letter it will settle on, so the finished text
    // is spaced like type rather than like a grid. Letters passing through
    // on the way may spill a little over their neighbours.
    const fitCells = (letters, element) => {
      const width = measure(element);
      letters.forEach(({ cell, char }) => {
        cell.width = width(char) + TRACKING;
        cell.element.style.width = `${cell.width.toFixed(3)}em`;
      });
    };

    const show = (cell, char) => {
      cell.halves.forEach((half) => {
        half.firstChild.textContent = char;
      });
      cell.current = char;
    };

    // The old top half falls away from the next letter waiting behind it,
    // then the next bottom half drops over the old one. Both flaps carry the
    // page colour, so they cover what is underneath and no half goes blank;
    // at rest they are hidden and only the two still halves show.
    const flip = async (cell, next) => {
      const [under, bottom, top, fold] = cell.halves;
      cell.busy = true;
      under.firstChild.textContent = next;
      fold.firstChild.textContent = next;
      top.style.visibility = "visible";
      const down = top.animate([{ transform: "rotateX(0deg)" }, { transform: "rotateX(-90deg)" }], { duration: FLIP_MS / 2, easing: "ease-in", fill: "forwards" });
      await down.finished;
      top.style.visibility = "";
      top.firstChild.textContent = next;
      down.cancel();
      fold.style.visibility = "visible";
      const up = fold.animate([{ transform: "rotateX(90deg)" }, { transform: "rotateX(0deg)" }], { duration: FLIP_MS / 2, easing: "ease-out", fill: "forwards" });
      await up.finished;
      bottom.firstChild.textContent = next;
      fold.style.visibility = "";
      up.cancel();
      cell.current = next;
      cell.busy = false;
    };

    // Swaps the content of `line` for `length` blank cells and keeps the
    // real text in a hidden label for screen readers.
    const build = (line, length = line.textContent.trim().length) => {
      const label = document.createElement("span");
      label.className = "minimal-flap__label";
      label.append(...line.childNodes);
      const row = document.createElement("span");
      row.className = "minimal-flap__row";
      row.setAttribute("aria-hidden", "true");

      const cells = Array.from({ length }, () => {
        const element = document.createElement("span");
        element.className = "minimal-flap__cell";
        const halves = ["under", "bottom", "top", "fold"].map((name) => {
          const half = document.createElement("span");
          half.className = `minimal-flap__half minimal-flap__half--${name}`;
          half.append(document.createElement("span"));
          element.append(half);
          return half;
        });
        row.append(element);
        const cell = { element, halves, busy: false, job: 0 };
        show(cell, " ");
        return cell;
      });
      line.replaceChildren(label, row);
      return cells;
    };

    // Flips a cell on through the drum, like a real board, until it shows
    // `target`. `maxSteps` caps the number of flaps by skipping ahead.
    const settle = async (cell, drum, target, maxSteps = Infinity) => {
      const job = ++cell.job;
      while (cell.busy) await new Promise((resolve) => window.setTimeout(resolve, 20));
      const wheel = drum.includes(target) ? drum : drum + target;
      const path = [];
      for (let i = wheel.indexOf(cell.current); wheel[i] !== target; ) {
        i = (i + 1) % wheel.length;
        path.push(wheel[i]);
      }
      for (const char of path.slice(-maxSteps)) {
        if (cell.job !== job) return;
        await flip(cell, char);
      }
    };

    // Rebuilds `element` as rows of blank cells for `words`, wrapped to
    // `maxWidth` pixels, and returns every cell with the letter it is to show.
    const compose = (element, words, maxWidth) => {
      const width = measure(element);
      const size = parseFloat(getComputedStyle(element).fontSize);
      const span = (text) => [...minimalCaps(text)].reduce((sum, char) => sum + width(char) + TRACKING, 0) * size;
      const rows = words
        .reduce((fitted, word) => {
          const last = fitted[fitted.length - 1];
          if (last && span(`${last} ${word}`) <= maxWidth) fitted[fitted.length - 1] = `${last} ${word}`;
          else fitted.push(word);
          return fitted;
        }, [])
        .map((text) => {
          const row = document.createElement("span");
          row.className = "minimal-flap__line";
          row.textContent = text;
          return row;
        });
      element.replaceChildren(...rows);
      const letters = rows.flatMap((row) => {
        const chars = [...minimalCaps(row.textContent)];
        return build(row).map((cell, i) => ({ cell, char: chars[i] }));
      });
      fitCells(letters, element);
      return letters;
    };

    return { DRUM, build, show, flip, settle, measure, fitCells, compose };
  })();
</script>
