<script>
  // The loader plays on a first visit and on a reload, not when arriving from
  // another page of the site or with the back button, and never with reduced
  // motion.
  (() => {
    const [navigation] = performance.getEntriesByType("navigation");
    const fromSite =
      navigation?.type === "back_forward" ||
      (document.referrer.startsWith(window.location.origin) && navigation?.type !== "reload");
    if (fromSite || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.documentElement.classList.add("minimal-loader-enabled");
  })();
</script>

<div class="minimal-loader" aria-hidden="true">
  <div class="minimal-loader__badge">
    {{ (resources.Get "images/superBadge.svg").Content | safeHTML }}
  </div>
</div>

<script>
  (() => {
    const root = document.documentElement;
    const loader = document.currentScript.previousElementSibling;
    if (!root.classList.contains("minimal-loader-enabled")) {
      loader.remove();
      return;
    }

    const MINIMUM_MS = 1900; // long enough for the badge to fill
    const startedAt = performance.now();
    let finished = false;

    const leave = () => {
      if (finished) return;
      finished = true;
      window.setTimeout(() => {
        loader.classList.add("is-leaving");
        window.setTimeout(() => {
          loader.remove();
          root.classList.remove("minimal-loader-enabled");
        }, 900);
      }, Math.max(0, MINIMUM_MS - (performance.now() - startedAt)));
    };

    if (document.readyState === "complete") {
      leave();
    } else {
      window.addEventListener("load", leave, { once: true });
    }

    window.setTimeout(leave, 4000);
  })();
</script>
