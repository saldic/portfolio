<header class="minimal-nav">
  <a class="minimal-nav__identity" href="{{ "" | relLangURL }}" aria-label="Dino Saldic — home">
    {{ (resources.Get "images/justCat.svg").Content | replaceRE `fill="#[0-9A-Fa-f]+"` `fill="currentColor"` | replaceRE `<svg ` `<svg aria-hidden="true" ` | safeHTML }}
  </a>

  {{ partial "nav-clock.html" . }}

  <div class="minimal-nav-menu" data-minimal-menu>
    <nav id="minimal-menu-panel" class="minimal-nav-menu__panel" aria-label="Primary navigation">
      <div class="minimal-nav-menu__links">
        {{ $home := cond .IsHome "" (relLangURL "") }}
        {{/* Hovering "projects" folds out the two projects under it. */}}
        <div class="minimal-nav-menu__group">
          <a href="{{ $home }}#projects">Projects</a>
          <div class="minimal-nav-menu__sub">
            <a href="{{ "projects/eru-project/what-is-eru/" | relLangURL }}">eru</a>
            <a href="{{ "projects/aida/" | relLangURL }}">“aida”</a>
          </div>
        </div>
        <a href="{{ $home }}#contact">Contact</a>
      </div>
    </nav>

    <button
      class="minimal-nav-menu__toggle"
      type="button"
      aria-expanded="false"
      aria-controls="minimal-menu-panel"
      aria-label="Open menu">
      {{/* The fleur-de-lis from the top right corner of the badge. */}}
      {{ $badge := findRE `<path[^>]*/>` (resources.Get "images/superBadge.svg").Content }}
      <svg class="minimal-nav-menu__lily" viewBox="797 68 79 79" aria-hidden="true">
        {{ range first 5 $badge }}{{ . | replaceRE `fill="#[0-9A-Fa-f]+"` `fill="currentColor"` | safeHTML }}{{ end }}
      </svg>
    </button>
  </div>
</header>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const menu = document.querySelector("[data-minimal-menu]");
    const toggle = menu?.querySelector(".minimal-nav-menu__toggle");
    const panel = menu?.querySelector(".minimal-nav-menu__panel");
    if (!menu || !toggle || !panel) return;

    const hoverCapable = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    let closeTimer;

    const setMenu = (open) => {
      menu.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", open.toString());
      toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      panel.toggleAttribute("inert", !open);
    };

    setMenu(false);
    toggle.addEventListener("click", (event) => {
      if (hoverCapable && event.detail > 0) {
        setMenu(true);
        return;
      }
      setMenu(!menu.classList.contains("is-open"));
    });

    if (hoverCapable) {
      menu.addEventListener("pointerenter", () => {
        window.clearTimeout(closeTimer);
        setMenu(true);
      });

      menu.addEventListener("pointerleave", () => {
        closeTimer = window.setTimeout(() => setMenu(false), 140);
      });
    }

    menu.addEventListener("focusin", () => {
      window.clearTimeout(closeTimer);
      setMenu(true);
    });

    menu.addEventListener("focusout", (event) => {
      if (!menu.contains(event.relatedTarget)) setMenu(false);
    });

    panel.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", () => setMenu(false));
    });

    document.addEventListener("pointerdown", (event) => {
      if (!menu.contains(event.target)) setMenu(false);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || !menu.classList.contains("is-open")) return;
      setMenu(false);
      toggle.focus();
    });
  });
</script>
