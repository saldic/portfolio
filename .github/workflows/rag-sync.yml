name: Sync Chip's knowledge base
on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "scripts/rag_sync.py"
      - "requirements-rag.txt"
      - ".github/workflows/rag-sync.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rag-sync
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rag.txt

      - name: Install dependencies
        run: pip install -r requirements-rag.txt

      - name: Run the sync script's tests
        run: python -m unittest tests.test_rag_sync

      # The state file remembers which pages are already in Dify and their hashes.
      # It is not in git, so it is kept in the Actions cache between runs.
      # If the cache is gone, the script updates every page once, which is safe.
      - name: Restore sync state
        uses: actions/cache/restore@v4
        with:
          path: .rag-sync-state.json
          key: rag-sync-state-${{ github.run_id }}
          restore-keys: rag-sync-state-

      - name: Sync pages to Dify
        env:
          DIFY_BASE_URL: ${{ vars.DIFY_BASE_URL }}
          DIFY_DATASET_ID: ${{ vars.DIFY_DATASET_ID }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: python scripts/rag_sync.py

      - name: Save sync state
        if: always() && hashFiles('.rag-sync-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .rag-sync-state.json
          key: rag-sync-state-${{ github.run_id }}-${{ github.run_attempt }}
